[workspace]
members = [
  "crates/agentview-cli",
  "crates/agentview-codex-app-server",
  "crates/agentview-codex-hosted",
  "crates/agentview-codex-runtime",
  "crates/agentview-core",
  "crates/agentview-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
agentview-codex-app-server = { path = "crates/agentview-codex-app-server" }
agentview-codex-hosted = { path = "crates/agentview-codex-hosted" }
agentview-codex-runtime = { path = "crates/agentview-codex-runtime" }
agentview-core = { path = "crates/agentview-core" }
agentview-tui = { path = "crates/agentview-tui" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = "0.29"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
